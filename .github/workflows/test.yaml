name: Choreo Connect Integration Tests - Nighly

on:
  schedule:
    # every day at 8:25pm UTC (1:55am IST )
    - cron:  '47 11 * * *'
  workflow_dispatch:
    inputs:
      name:
        description: 'Person to greet'
        required: true
        default: 'Mona the Octocat'
      home:
        description: 'location'
        required: false
        default: 'The Octoverse'
jobs:
  check_continue:
    runs-on: ubuntu-latest
    name: Check continuing testing
    outputs:
      should_run: ${{ steps.should_run.outputs.should_run }}
    steps:
      - uses: actions/checkout@v2
      - id: should_run
        continue-on-error: true
        name: Check latest commit is less than a day
        # if: ${{ github.event_name == 'schedule' }}
        run: |
          if [ $(git rev-list --after="1 days ago" --count HEAD) -gt 15 ]; then
            echo "::set-output name=should_run::true"
          fi

  build:
    needs: check_continue
    if: ${{ needs.check_continue.outputs.should_run != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Set up JDK 11
        uses: actions/setup-java@v2
        with:
          java-version: '11'
          distribution: 'adopt'
      - name: Setup Go environment
        uses: actions/setup-go@v2
        with:
          go-version: '1.15.x'
      - name: Cache M2 Repo
        uses: actions/cache@v1
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Cache Go Modules
        uses: actions/cache@v2
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: Setup Pre Req
        run: |
          export DOCKER_COMPOSE_VERSION=1.23.2
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo apt-key add -
          sudo add-apt-repository "deb [arch=amd64] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable"
          sudo apt-get update
          sudo apt-get -y -o Dpkg::Options::="--force-confnew" install docker-ce
          sudo rm /usr/local/bin/docker-compose
          curl -L https://github.com/docker/compose/releases/download/${DOCKER_COMPOSE_VERSION}/docker-compose-`uname -s`-`uname -m` > docker-compose
          chmod +x docker-compose
          sudo mv docker-compose /usr/local/bin
          docker pull testcontainers/ryuk:0.3.0
          export `go env | grep GOPATH`
          export PATH="${GOPATH}/bin:${PATH}"
      - name: Extract Maven project version
        run: echo ::set-output name=version::$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
        id: extract-project-version
      - name: Print Maven project version
        run: echo ${{ steps.extract-project-version.outputs.version }}
      - name: Build with Maven
        run: |
          export PATH="${HOME}/go/bin:${PATH}"
          mvn clean install -PRelease -s .maven/settings.xml
      - name: Build multi platform Ubuntu images
        run: |
          ./build-ubuntu-multi-platform-images.sh all
      - name: Setup Trivy
        run: |
          wget https://github.com/aquasecurity/trivy/releases/download/v0.21.0/trivy_0.21.0_Linux-64bit.tar.gz
          tar -xzf trivy_0.21.0_Linux-64bit.tar.gz
          echo "$(pwd)" >> $GITHUB_PATH
        # Using custom Trivy instead of "aquasecurity/trivy-action@0.1.0" to customize the behaviour
        # Run Trivy scan for all images and fail if one failed
      - name: Trivy Scan
        run: |
          TAG=${{ steps.extract-project-version.outputs.version }}
          SEVERITY="CRITICAL,HIGH,MEDIUM"
          EXIT_CODE=0
          echo "Default alpine images"
          trivy --exit-code 1 --severity "${SEVERITY}" wso2/choreo-connect-adapter:$TAG || EXIT_CODE=$?
          trivy --exit-code 1 --severity "${SEVERITY}" wso2/choreo-connect-enforcer:$TAG || EXIT_CODE=$?
          trivy --exit-code 1 --severity "${SEVERITY}" wso2/choreo-connect-router:$TAG || EXIT_CODE=$?

          echo "Ubuntu AMD images"
          SUFFIX="-ubuntu-linux_amd64"
          trivy --exit-code 1 --severity "${SEVERITY}" wso2/choreo-connect-adapter:${TAG}${SUFFIX} || EXIT_CODE=$?
          trivy --exit-code 1 --severity "${SEVERITY}" wso2/choreo-connect-enforcer:$TAG${SUFFIX} || EXIT_CODE=$?
          trivy --exit-code 1 --severity "${SEVERITY}" wso2/choreo-connect-router:$TAG${SUFFIX} || EXIT_CODE=$?

          echo "Ubuntu ARM images"
          SUFFIX="-ubuntu-linux_arm64"
          trivy --exit-code 1 --severity "${SEVERITY}" wso2/choreo-connect-adapter:${TAG}${SUFFIX} || EXIT_CODE=$?
          trivy --exit-code 1 --severity "${SEVERITY}" wso2/choreo-connect-enforcer:$TAG${SUFFIX} || EXIT_CODE=$?
          trivy --exit-code 1 --severity "${SEVERITY}" wso2/choreo-connect-router:$TAG${SUFFIX} || EXIT_CODE=$?

          # error if one of trivy scan failed
          exit EXIT_CODE
